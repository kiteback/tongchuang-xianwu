spring:
  data:
    elasticsearch:
      repositories:
        enabled: false
  datasource:
    url: jdbc:h2:mem:tcxw;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  ai:
    model:
      chat: none

jwt:
  secret: this-is-a-test-secret-key-at-least-32-characters
